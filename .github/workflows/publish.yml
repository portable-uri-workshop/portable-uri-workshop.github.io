name: Build, publish, attest, and release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test redirector policy
        run: npm test
      - name: Build exact site payload
        run: npm run build -- "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-payload
          path: _site
          include-hidden-files: true
          if-no-files-found: error

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-payload
          path: _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      # The official upload-pages-artifact composite currently calls
      # actions/upload-artifact@v4 by a movable tag, which is rejected by the
      # repository's full-SHA policy. These are its equivalent pinned steps.
      - name: Archive Pages artifact
        run: |
          tar --dereference --hard-dereference \
            --directory _site \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  package-attest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-payload
          path: _site
      - name: Create deterministic Pages payload ZIP and checksum
        run: |
          mkdir -p dist
          (
            cd _site
            find . -type f | LC_ALL=C sort | zip -X "../dist/portable-uri-redirector-${GITHUB_REF_NAME}.zip" -@
          )
          sha256sum "dist/portable-uri-redirector-${GITHUB_REF_NAME}.zip" > "dist/portable-uri-redirector-${GITHUB_REF_NAME}.zip.sha256"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/portable-uri-redirector-${{ github.ref_name }}.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: dist
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package-attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: dist
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Portable URI Redirector maintenance release.

          - Keeps 250ms automatic opening for validated custom-scheme URIs.
          - Blocks Android intent URIs and browser fallback redirects in every scheme casing.
          - Removes the target fragment after parsing and stores only a SHA-256 loop fingerprint.
          - Blocks direct web, browser, local, and executable schemes.
          - Uses no external assets, analytics, or network APIs.
          - Includes the exact Pages payload ZIP, SHA-256, and GitHub Artifact Attestation.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Portable URI Redirector $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
